name: Actualizar datos JOLI JOLI

on:
  schedule:
    # Horarios en UTC. Perú es UTC-5, así que resta 5h para saber la hora local.
    - cron: '0 11 * * *'   # 06:00 Perú
    - cron: '0 16 * * *'   # 11:00 Perú
    - cron: '0 20 * * *'   # 15:00 Perú
    - cron: '0 0  * * *'   # 19:00 Perú (día anterior en UTC)
  workflow_dispatch: {}     # permite ejecutarlo a mano desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Crear carpeta data
        run: mkdir -p data

      - name: Descargar dashboard
        env:
          API_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: curl -sL -f "$API_URL?reporte=dashboard" -o data/dashboard.json

      - name: Descargar árbol de pedidos
        env:
          API_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: curl -sL -f "$API_URL?reporte=arbolPedidos" -o data/arbolPedidos.json

      - name: Descargar control de empaque
        env:
          API_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: curl -sL -f "$API_URL?reporte=recepcionEmpaque" -o data/recepcionEmpaque.json

      # Opcional: cachear también el reporte semanal de la semana actual (lunes a hoy)
      - name: Descargar reporte semanal (semana actual)
        env:
          API_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          FECHA_INI=$(date -d "monday" +%d/%m/%Y)
          FECHA_FIN=$(date +%d/%m/%Y)
          curl -sL -f "$API_URL?reporte=semanal&fechaIni=${FECHA_INI}&fechaFin=${FECHA_FIN}" -o data/semanal.json

      - name: Descargar plan de armado (hoy → +7 días)
        env:
          API_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          FECHA=$(date +%d/%m/%Y)
          curl -sL -f "$API_URL?reporte=planSemana&fecha=${FECHA}&dias=8" -o data/planSemana.json

      - name: Descargar estado por modelo (uno por cada modelo activo)
        env:
          API_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          mkdir -p data/estadoModelo
          # Requiere que Apps Script tenga un endpoint reporte=listaModelos
          # que devuelva algo como: {"modelos": ["DIANA", "RENATA", "GRACE", ...]}
          if curl -sL -f "$API_URL?reporte=listaModelos" -o /tmp/modelos.json; then
            for MODELO in $(jq -r '.modelos[]' /tmp/modelos.json); do
              SLUG=$(echo "$MODELO" | iconv -t ascii//TRANSLIT | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/_/g; s/^_+|_+$//g')
              curl -sL -f "$API_URL?reporte=estadoModelo&modelo=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$MODELO")" \
                -o "data/estadoModelo/${SLUG}.json"
            done
          else
            echo "⚠️ No existe reporte=listaModelos todavía en Apps Script — se omite el precacheo de estadoModelo."
          fi

      - name: Registrar hora de actualización
        run: |
          echo "{\"actualizado\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/meta.json

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Actualización automática de datos $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
